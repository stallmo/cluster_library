[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-library"
version = "0.1.0"
description = "Compact implementations of cluster algorithms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=2.0.2", "scipy>=1.13.1"]
authors = [{ name = "Mo Sta", email = "mo.sta@web.de" }]

[tool.setuptools.packages.find]
where = ["src"]
